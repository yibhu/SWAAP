# Frozen core scientific versions; installed on an isolated Linux/WSL3090 environment.
# The historical nightly wheel is verified below; do not substitute a newerTorch.
# Full resolved dependency report accompanies the engineering validation.
name: swaap-tdmpc2
channels:
  - pytorch-nightly
  - nvidia
  - conda-forge
dependencies:
  - python=3.9.21
  - pip=24.0
  - glew=2.2.0
  - glib=2.78.4
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/nightly/cu124
      - torch @ https://download.pytorch.org/whl/nightly/cu124/torch-2.6.0.dev20241112%2Bcu124-cp39-cp39-linux_x86_64.whl#sha256=387a1fc1e164c97c149c868a276ce205b8a2ffa5b59209747e5bcc8c103533fb
      - numpy==1.24.4
      - dm-control==1.0.16
      - mujoco==3.1.2
      - gymnasium==0.29.1
      - glfw==2.7.0
      - omegaconf==2.3.0
      - hydra-core==1.3.2
      - tensordict-nightly==2025.1.1
      - termcolor==2.4.0
      - tqdm==4.66.4
      - PyYAML==6.0.2

# TorchRL is not imported by the scientific modules in this release. The
# original optional declaration is therefore omitted, rather than upgraded.
