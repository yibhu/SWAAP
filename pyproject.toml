[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "swaap-reproduction"
version = "0.1.0.dev0"
description = "Research reproduction of SWAAP world-model data poisoning"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["PyYAML==6.0.2"]

[project.optional-dependencies]
saved = ["numpy==2.2.6"]
plots = ["numpy==2.2.6", "matplotlib==3.10.7", "pandas==2.2.3", "Pillow==11.0.0"]
test = ["pytest==8.3.3"]

[project.scripts]
swaap = "swaap.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
license-files = ["licenses/*.txt", "THIRD_PARTY_NOTICES.md"]

[tool.setuptools.package-data]
"swaap.resources" = ["*.json"]
"swaap.latent" = ["*.yaml", "*.json", "_vendor/envs/tasks/*.xml"]
"swaap.graybox" = ["*.json"]
"swaap.dino" = ["*.json", "_vendor/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
